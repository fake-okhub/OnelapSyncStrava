name: Sync Onelap to Strava

on:
  # 每天凌晨 1 点 (UTC 17:00，北京时间 UTC+8)
  schedule:
    - cron: '0 17 * * *'
  # 支持手动触发
  workflow_dispatch:

env:
  GO_VERSION: '1.21'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build application
        run: go build -ldflags="-s -w" -o OnelapSyncStrava main.go

      - name: Create config from secrets
        run: |
          cat > config.json << EOF
          {
            "onelap": {
              "account": "${{ secrets.ONELAP_ACCOUNT }}",
              "password": "${{ secrets.ONELAP_PASSWORD }}"
            },
            "strava": {
              "client_id": "${{ secrets.STRAVA_CLIENT_ID }}",
              "client_secret": "${{ secrets.STRAVA_CLIENT_SECRET }}",
              "access_token": "${{ secrets.STRAVA_ACCESS_TOKEN }}",
              "refresh_token": "${{ secrets.STRAVA_REFRESH_TOKEN }}",
              "expires_at": ${{ secrets.STRAVA_EXPIRES_AT }}
            }
          }
          EOF

      - name: Restore state from cache
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: onelap-sync-state-${{ github.run_id }}
          restore-keys: onelap-sync-state-

      - name: Run sync
        id: sync
        run: |
          ./OnelapSyncStrava sync 2>&1 | tee sync.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Extract updated tokens
        if: always()
        id: tokens
        run: |
          if [ -f config.json ]; then
            ACCESS_TOKEN=$(jq -r '.strava.access_token' config.json)
            REFRESH_TOKEN=$(jq -r '.strava.refresh_token' config.json)
            EXPIRES_AT=$(jq -r '.strava.expires_at' config.json)

            # Mask sensitive values
            echo "::add-mask::$ACCESS_TOKEN"
            echo "::add-mask::$REFRESH_TOKEN"

            echo "access_token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
            echo "refresh_token=$REFRESH_TOKEN" >> $GITHUB_OUTPUT
            echo "expires_at=$EXPIRES_AT" >> $GITHUB_OUTPUT

            # Check if tokens changed
            if [ "$REFRESH_TOKEN" != "${{ secrets.STRAVA_REFRESH_TOKEN }}" ]; then
              echo "tokens_changed=true" >> $GITHUB_OUTPUT
            else
              echo "tokens_changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Save state to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: onelap-sync-state-${{ github.run_id }}

      - name: Commit state file
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -f state.json ]; then
            git checkout -b sync-state || git checkout sync-state
            git add state.json 2>/dev/null || true
            git diff --quiet && git diff --staged --quiet || \
              git commit -m "Update sync state [skip ci]" && \
              git push origin sync-state --force || true
          fi

      - name: Sync summary
        if: always()
        run: |
          echo "## 🚴 Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f state.json ]; then
            SYNCED_COUNT=$(jq '.synced_activities | length' state.json 2>/dev/null || echo "0")
            echo "✅ **Total synced activities:** ${SYNCED_COUNT}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ -f sync.log ]; then
              echo "### Sync Log" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -20 sync.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "ℹ️ No state file generated" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.tokens.outputs.tokens_changed }}" == "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ Token Refresh Notice" >> $GITHUB_STEP_SUMMARY
            echo "Strava tokens were refreshed. New tokens:" >> $GITHUB_STEP_SUMMARY
            echo "- ACCESS_TOKEN: \`${{ steps.tokens.outputs.access_token }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- REFRESH_TOKEN: \`${{ steps.tokens.outputs.refresh_token }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- EXPIRES_AT: \`${{ steps.tokens.outputs.expires_at }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please update these values in GitHub Secrets." >> $GITHUB_STEP_SUMMARY
          fi
